<body>
  <h1>AP1 - Ejercicio 2: Recorrer array</h1>
  <p>Abre la consola del navegador (F12 &rarr; pestaña <strong>Consola</strong>) y recarga la página (F5) para ver el resultado.</p>
  <p>Para depurar, usa la pestaña <strong>Depurador / Sources</strong>.</p>

<script>
// ============================================================
// EJERCICIO 2: Recorrer un array
// Objetivo: calcular suma, máximo y media de una lista de números.
//
// RESULTADO ESPERADO:
//   Suma: 15
//   Máximo: 9
//   Media: 3
//   Máximo con negativos: -2
//
// TAREA: encuentra y corrige los errores. Usa console.log,
// puntos de interrupción (breakpoints) y el panel "Watch"
// de las DevTools para seguir el valor de las variables.
// ============================================================

// Errores corregidos:
// 1. Línea de la función sumar: tipo lógica. Se inicializaba "total" como cadena vacía
//    y se recorría desde i = 1, por lo que concatenaba en lugar de sumar y se saltaba el
//    primer elemento. Se corrigió a 0, con un bucle desde 0 hasta array.length - 1.
// 2. Línea de la función maximo: tipo lógica. El valor inicial de "max" era 0, por lo que
//    los números negativos no podían calcularse correctamente. Se corrigió tomando el
//    primer elemento del array como valor inicial.
// 3. Línea de la función media: tipo ejecución. Se llamaba a array.length() como si fuera
//    una función, pero length es una propiedad. Se corrigió a array.length.

function sumar(array) {
  let total = 0;
  for (let i = 0; i < array.length; i++) {
    total += array[i];
  }
  return total;
}

function maximo(array) {
  let max = array[0];
  for (let i = 1; i < array.length; i++) {
    if (array[i] > max) {
      max = array[i];
    }
  }
  return max;
}

function media(array) {
  return sumar(array) / array.length;
}

let numeros = [4, -2, 9, 1, 3];

console.log("Suma:", sumar(numeros));
console.log("Máximo:", maximo(numeros));
console.log("Media:", media(numeros));
console.log("Máximo con negativos:", maximo([-5, -2, -9]));
</script>
